<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- EXEMPLOS DE ETUQUETAS (BADGES) -->
<div class="badge-group">
  <span class="badge badge-urgent">Urgente</span>
  <span class="badge badge-success">Meta Atingida</span>
</div>

<!-- EXEMPLO DE ALERTA DE SUCESSO -->
<div class="alert alert-success">
  <strong>Cadastro Concluído!</strong> Seus dados foram salvos no nosso sistema de voluntariado.
</div>

<!-- EXEMPLO DE ALERTA DE ERRO -->
<div class="alert alert-error">
  <strong>Erro de Validação:</strong> Por favor, verifique o formato do CPF digitado.
</div>

<!-- SIMULAÇÃO VISUAL DO MODAL DE CONFIRMAÇÃO -->
<div class="modal-backdrop-mock">
  <div class="modal-box">
    <div class="modal-header">Confirmar Envio de Dados</div>
    <div class="modal-body">
      Deseja confirmar o seu cadastro na plataforma da organização social?
    </div>
    <div class="modal-footer">
      <button type="button" class="form-input" style="width: auto; margin: 0;">Cancelar</button>
      <button type="button" class="btn-submit" style="width: auto; margin: 0; padding: 10px 20px;">Confirmar</button>
    </div>
  </div>
</div>

</body>
</html>
