<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>
<body>

    <main>
        <h1>Formulário de Cadastro</h1>
        
        <form action="/enviar-cadastro" method="POST">

            <!-- Agrupamento 1: Dados de Identificação Pessoal -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <p>
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome_completo" required autocomplete="name">
                </p>
                
                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </p>
                
                <p>
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" id="data-nascimento" name="data_nascimento" required>
                </p>
                <p>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" maxlength="14" placeholder="000.000.000-00" required>
                </p>
                <p>
                    <label for="fone">Numero telefonico:</label>
                    <input type="text" id="fone" name="fone" pattern="\(\d{2}\)\s\d{5}-\d{4}" maxlength="15" minlength="15" placeholder="(xx) 9xxxx-xxxx" required>
                </p>
            </fieldset>

            <!-- Agrupamento 2: Dados de Localização e Entrega -->
            <fieldset>
                <legend>Endereço de Residência</legend>
                
                <p>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" maxlength="9" placeholder="00000-000" required>
                </p>
                <p>
                    <label for="endereco">Logradouro (Rua, Av.):</label>
                    <input type="text" id="endereco" name="endereco" required autocomplete="street-address">
                </p>
                
                <p>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </p>
                
                <p>
                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" required maxlength="2" pattern="[A-Z]{2}" title="Insira a sigla do estado com duas letras maiúsculas (ex: SP)">
                </p>
            </fieldset>

            <!-- Botão de envio -->
            <p>
                <button type="submit">Finalizar Cadastro</button>
            </p>

        </form>
    </main>

</body>
</html>
