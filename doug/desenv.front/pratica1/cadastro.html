<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário - Nome da ONG</title>
  <link class="styles" rel="stylesheet" href="./pratica2/style.css">
</head>
<body>

  <!-- CABEÇALHO REPLICADO -->
  <header class="header">
    <div class="grid-container">
      <nav class="header-nav" aria-label="Navegação Principal">
        <div class="logo">Nome da ONG</div>
        <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
        <label for="menu-toggle" class="menu-toggle-label" aria-label="Abrir Menu de Navegação">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </label>
        <ul class="nav-list">
          <li class="nav-item"><a href="index.html" data-route="home" class="nav-link">Início</a></li>
          <li class="nav-item">
            <a href="#" data-route="home" class="nav-link">Quem Somos</a>
            <ul class="dropdown-menu">
              <li><a href="#" data-route="home" class="nav-link">Nossa Missão</a></li>
              <li><a href="#" data-route="home" class="nav-link">Como Atuamos</a></li>
            </ul>
          </li>
          <li class="nav-item"><a href="cadastro.html" data-route="cadastro" class="nav-link" aria-current="page">Cadastre-se</a></li>
          <li class="nav-item"><a href="#" data-route="home" class="nav-link">Contato</a></li>
          <li class="nav-item"><a href="#" data-route="404" class="nav-link">Política de Privacidade</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- FORMULÁRIO EM MALHA GRID RESPONSIVA -->
  <main class="grid-container">
    
    <form id="form-cadastro" class="form-container grid-container" action="#" method="POST" novalidate>
      <h1 class="form-title">Cadastro de Usuário</h1>

      <!-- BLOCO: DADOS PESSOAIS -->
      <h2 class="form-section-title">Dados Pessoais</h2>

      <div class="form-group">
        <label class="form-label" for="nome">Nome Completo:</label>
        <input class="form-input" type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="email">E-mail:</label>
        <input class="form-input" type="email" id="email" name="email" required placeholder="exemplo@ong.org">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="nascimento">Data de Nascimento:</label>
        <input class="form-input" type="date" id="nascimento" name="nascimento" required>
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="cpf">CPF:</label>
        <input class="form-input" type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="telefone">Número telefônico:</label>
        <input class="form-input" type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
      </div>

      <!-- BLOCO: ENDEREÇO -->
      <h2 class="form-section-title">Endereço de Residência</h2>

      <div class="form-group form-group-half">
        <label class="form-label" for="cep">CEP:</label>
        <input class="form-input" type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="logradouro">Logradouro (Rua, Av.):</label>
        <input class="form-input" type="text" id="logradouro" name="logradouro" required placeholder="Rua, Avenida, Travessa...">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="cidade">Cidade:</label>
        <input class="form-input" type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
      </div>

      <div class="form-group form-group-half">
        <label class="form-label" for="estado">Estado (UF):</label>
        <input class="form-input" type="text" id="estado" name="estado" required maxlength="2" placeholder="Ex: RN">
      </div>

      <!-- BOTÃO DE SUBMISSÃO -->
      <button class="btn-submit" type="submit">Finalizar Cadastro</button>
    </form>

  </main>

  <!-- RODAPÉ REPLICADO -->
  <footer class="footer">
    <div class="grid-container">
      <div class="footer-container">
        <p class="footer-text">&copy; 2026 Nome da ONG. Todos os direitos reservados.</p>
        <p class="footer-text">Desenvolvido com foco em acessibilidade.</p>
      </div>
    </div>
  </footer>

  <script src="https://unpkg.com/imask"></script>
  <script type="module" src="./pratica3/main.js"></script>

</body>
</html>
